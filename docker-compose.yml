services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: klypvio
      POSTGRES_USER: klypvio
      POSTGRES_PASSWORD: klypvio
    ports:
      - "5432:5432"
    volumes:
      - klypvio-postgres:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  klypvio-postgres:
